name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The pnpm version comes from "packageManager" in package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install (exactly what the lockfile says)
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      # A production build with placeholder values, so no real database or key is
      # needed or touched. It catches broken imports, routes and server actions.
      - name: Build
        run: pnpm build
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-not-a-real-key
          SUPABASE_SERVICE_ROLE_KEY: placeholder-not-a-real-key
          NEXT_TELEMETRY_DISABLED: "1"
